{% extends "base.html" %}
{% block title %}Reset Password — OpsTracker{% endblock %}

{% block content %}
<div class="login-page-backdrop">
    <div class="login-page-glow login-page-glow--pink"></div>
    <div class="login-page-glow login-page-glow--blue"></div>

    <div class="login-master-card" style="max-width:440px; margin: 40px auto; min-height:auto;">
        <div class="login-form-panel" style="padding:40px 32px; width:100%;">
            
            <!-- Icon Badge (Shield Checkmark) -->
            <div style="display:flex; justify-content:center; margin-bottom:20px;">
                <div style="width:72px; height:72px; background:linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 25px rgba(29, 78, 216, 0.3);">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Header -->
            <div class="login-form-header" style="text-align:center; margin-bottom:28px;">
                <h1 class="login-form-title" style="font-size:1.6rem; font-weight:800;">Reset password</h1>
                <p class="login-form-subtitle" style="font-size:0.88rem; color:var(--text-tertiary);">Create your OpsTracker Account Password</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('reset_password') }}" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- New Password -->
                <div class="login-field">
                    <div class="login-input-wrap">
                        <input
                            type="password"
                            id="reset-password-1"
                            name="password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            class="login-input"
                            placeholder="New password"
                            style="height:48px; border-radius:14px; background:var(--bg-surface); border:1px solid var(--border-subtle);"
                        >
                        <button type="button" class="login-eye-toggle" onclick="togglePasswordVisibility('reset-password-1')">
                            <svg class="login-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="login-field" style="margin-top:12px;">
                    <div class="login-input-wrap">
                        <input
                            type="password"
                            id="reset-password-2"
                            name="confirm_password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            class="login-input"
                            placeholder="Confirm password"
                            style="height:48px; border-radius:14px; background:var(--bg-surface); border:1px solid var(--border-subtle);"
                        >
                        <button type="button" class="login-eye-toggle" onclick="togglePasswordVisibility('reset-password-2')">
                            <svg class="login-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit" style="height:48px; border-radius:14px; background:#2563eb; font-weight:700; font-size:1rem; margin-top:20px;">
                    Login
                </button>
            </form>

            <!-- Footer -->
            <p class="login-form-footer" style="text-align:center; margin-top:24px;">
                Know your password?
                <a href="{{ url_for('login') }}" style="color:#2563eb; font-weight:600;">Log in</a>
            </p>

        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(fieldId) {
    const input = document.getElementById(fieldId);
    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}
</script>
{% endblock %}
