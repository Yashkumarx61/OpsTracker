{% extends "base.html" %}
{% block title %}Forgot Password — OpsTracker{% endblock %}

{% block content %}
<div class="login-page-backdrop">
    <div class="login-page-glow login-page-glow--pink"></div>
    <div class="login-page-glow login-page-glow--blue"></div>

    <div class="login-master-card" style="max-width:440px; margin: 40px auto; min-height:auto;">
        <div class="login-form-panel" style="padding:40px 32px; width:100%;">
            
            <!-- Icon Badge (Lock with shield) -->
            <div style="display:flex; justify-content:center; margin-bottom:20px;">
                <div style="width:72px; height:72px; background:linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius:20px; display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 25px rgba(29, 78, 216, 0.3);">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>

            <!-- Header -->
            <div class="login-form-header" style="text-align:center; margin-bottom:28px;">
                <h1 class="login-form-title" style="font-size:1.6rem; font-weight:800;">Forget password?</h1>
                <p class="login-form-subtitle" style="font-size:0.88rem; color:var(--text-tertiary);">Forgot Password? Quickly Reset Your Password</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('forgot_password') }}" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="login-field">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        class="login-input"
                        placeholder="Enter your username or email"
                        style="text-align:center; height:48px; border-radius:14px; background:var(--bg-surface); border:1px solid var(--border-subtle);"
                    >
                </div>

                <button type="submit" class="login-submit" style="height:48px; border-radius:14px; background:#2563eb; font-weight:700; font-size:1rem; margin-top:16px;">
                    Continue
                </button>
            </form>

            <!-- Footer -->
            <p class="login-form-footer" style="text-align:center; margin-top:24px;">
                Remembered your password?
                <a href="{{ url_for('login') }}" style="color:#2563eb; font-weight:600;">Log in</a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
