{% extends "base.html" %}
{% block title %}Register — OpsTracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">

        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon-wrap auth-icon-emerald">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z" />
                </svg>
            </div>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Join OpsTracker to manage projects & tasks</p>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <form method="POST" action="{{ url_for('register') }}" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Full Name -->
                <div>
                    <label for="full_name" class="label">Full name</label>
                    <input type="text" id="full_name" name="full_name" required autocomplete="name"
                        class="input" placeholder="Jane Doe">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="label">Email address</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="input" placeholder="jane@company.com">
                </div>

                <!-- Employee ID (Optional) -->
                <div>
                    <label for="employee_id" class="label">Employee ID <span style="font-weight:400;color:var(--text-tertiary)">(Optional)</span></label>
                    <input type="text" id="employee_id" name="employee_id"
                        class="input" placeholder="e.g. EMP-1005 (auto-generated if empty)">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="label">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password"
                        class="input" placeholder="Minimum 6 characters">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="label">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password"
                        class="input" placeholder="Re-enter your password">
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary btn-emerald">
                    <svg style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Create Account
                </button>
            </form>
        </div>

        <!-- Footer link -->
        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
