name: OpsTracker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: Run Python tests & linting on GitHub-hosted runner (Fast & pre-configured)
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & lint
        run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 2: Build & Push Docker image (with lowercased repository tag)
  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${REPO_LOWER}:latest" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_TAG }}

  # JOB 3: Deploy to your Windows Server EC2 using Docker
  deploy:
    name: Deploy to Windows Server (IIS)
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
      packages: read   # <-- Grants GITHUB_TOKEN read access to pull from GHCR

    steps:
      - name: Authenticate Docker to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and Run Container
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          $IMAGE = "ghcr.io/${repo}:latest"
          
          Write-Host "Pulling Docker image: $IMAGE"
          docker pull $IMAGE
          
          # Remove previous container if running
          $existing = docker ps -a -q -f "name=opstracker-app"
          if ($existing) {
              Write-Host "Removing existing container opstracker-app..."
              docker rm -f opstracker-app
          }

          # Run container on port 5000 (proxied by IIS)
          Write-Host "Starting new container opstracker-app..."
          docker run -d `
            --name opstracker-app `
            --restart unless-stopped `
            -p 5000:5000 `
            $IMAGE
