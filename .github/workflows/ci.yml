name: OpsTracker CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Code Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat other complexity/lint warnings softly
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify Python Compilation
        run: |
          python -m py_compile app.py config.py

  windows-server-test:
    name: Windows Server Environment & IIS Config Test
    runs-on: [self-hosted, Windows]
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 on Windows
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies on Windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate IIS web.config XML Syntax
        shell: powershell
        run: |
          Write-Host "Validating web.config XML schema..."
          [xml]$xml = Get-Content -Path .\web.config
          if ($xml.configuration.system.webServer.handlers.add.name -eq "PythonHandler") {
              Write-Host "IIS PythonHandler FastCGI configuration verified successfully."
          } else {
              Write-Error "Invalid web.config structure for IIS PythonHandler FastCGI."
              exit 1
          }

      - name: Test Flask App Initialization on Windows
        shell: powershell
        run: |
          $env:SECRET_KEY="ci-testing-secret-key"
          $env:FLASK_ENV="testing"
          python -c "import app; print('Flask App Initialized Successfully on Windows Environment')"

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: opstracker:latest

