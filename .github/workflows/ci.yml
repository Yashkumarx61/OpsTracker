name: OpsTracker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: Run Python tests & linting on GitHub-hosted runner (Fast & pre-configured)
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & lint
        run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 2: Build & Push Docker image
  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/opstracker:latest .
          docker push ghcr.io/${{ github.repository }}/opstracker:latest

  # JOB 3: Deploy to your Windows Server EC2 using Docker
  deploy:
    name: Deploy to Windows Server
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    steps:
      - name: Authenticate Docker to GHCR
        shell: powershell
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and Run Container
        shell: powershell
        run: |
          docker pull ghcr.io/${{ github.repository }}/opstracker:latest
          
          # Remove previous container if running
          $existing = docker ps -a -q -f "name=opstracker-app"
          if ($existing) { docker rm -f opstracker-app }

          # Run container on port 5000 (proxied by IIS)
          docker run -d `
            --name opstracker-app `
            --restart unless-stopped `
            -p 5000:5000 `
            ghcr.io/${{ github.repository }}/opstracker:latest
