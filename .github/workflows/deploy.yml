name: OpsTracker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yashkumarx61/opstracker
  APP_PORT: 5000

jobs:
  # ============================================================================
  # JOB 1: Lint & Code Quality (Runs on Ubuntu for speed)
  # ============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================================
  # JOB 2: Build & Push Native Windows Container
  # ============================================================================
  build-and-push:
    name: Build & Push Windows Container
    needs: lint
    runs-on: windows-2022   # Required to build Windows container images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        shell: powershell
        run: |
          $tag = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t $tag .
          docker push $tag

  # ============================================================================
  # JOB 3: Deploy to Windows Server EC2 via Self-Hosted Runner
  # ============================================================================
  deploy:
    name: Deploy to Windows Server (IIS)
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate Docker on Server
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and Restart Container
        shell: powershell
        run: |
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          # Pull fresh Windows container image
          docker pull $image

          # Stop and remove existing container if running
          $existing = docker ps -a -q -f "name=opstracker-app"
          if ($existing) {
              docker rm -f opstracker-app
          }

          # Run container bound to port 5000
          docker run -d `
            --name opstracker-app `
            --restart unless-stopped `
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} `
            $image

      - name: Health Check Application Port
        shell: powershell
        run: |
          Start-Sleep -Seconds 10
          try {
              $response = Invoke-WebRequest -Uri "http://localhost:${{ env.APP_PORT }}" -UseBasicParsing -TimeoutSec 10
              Write-Host "Container healthy, response code: $($response.StatusCode)"
          } catch {
              Write-Warning "Health check returned: $_"
          }
