name: OpsTracker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Primary registry image name (forced lowercase in steps)
  IMAGE_NAME: yashkumarx61/opstracker
  APP_PORT: 5000
  CONTAINER_NAME: opstracker-app

jobs:
  # ============================================================================
  # JOB 1: Lint & Code Quality (Runs on Ubuntu for speed)
  # ============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Flake8 Code Quality Checks
        run: |
          # Stop build if there are Python syntax errors or undefined symbols
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings check (exit-zero for complexity warnings)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ============================================================================
  # JOB 2: Build & Push Native Windows Container
  # ============================================================================
  build-and-push:
    name: Build & Push Windows Container
    needs: lint
    runs-on: windows-2022   # Matches Windows Server LTSC 2022 host kernel
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.prep.outputs.sha_tag }}
      image_tag_latest: ${{ steps.prep.outputs.latest_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Lowercase Image Tags
        id: prep
        shell: powershell
        run: |
          $repoLower = "${{ github.repository }}".ToLower()
          $registry = "${{ env.REGISTRY }}"
          $sha = "${{ github.sha }}"
          
          $shaTag = "${registry}/${repoLower}:${sha}"
          $latestTag = "${registry}/${repoLower}:latest"

          Write-Host "Computed SHA Tag: $shaTag"
          Write-Host "Computed Latest Tag: $latestTag"

          echo "sha_tag=$shaTag" >> $env:GITHUB_OUTPUT
          echo "latest_tag=$latestTag" >> $env:GITHUB_OUTPUT

      - name: Initialize Docker CLI configuration
        shell: powershell
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP "docker-config"
          New-Item -ItemType Directory -Path $dockerConfig -Force | Out-Null
          
          # Initialize clean ASCII JSON configuration
          '{}' | Set-Content -Path (Join-Path $dockerConfig "config.json") -Encoding ascii
          
          # Set DOCKER_CONFIG in the GitHub runner environment
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using isolated Docker config: $dockerConfig"

      - name: Free disk space before Docker login
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Running pre-login disk cleanup..."

          $cleanupPaths = @(
            "C:\Windows\Temp\*",
            "$env:TEMP\*"
          )

          foreach ($path in $cleanupPaths) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
          }

          docker image prune -af

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Docker prune finished with exit code $LASTEXITCODE; continuing pipeline."
          } else {
            Write-Host "Dangling Docker images pruned without touching database volumes."
          }

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Container Image
        shell: powershell
        run: |
          $shaTag = "${{ steps.prep.outputs.sha_tag }}"
          $latestTag = "${{ steps.prep.outputs.latest_tag }}"

          Write-Host "Building Windows Docker image..."
          docker build -t $shaTag -t $latestTag .
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker build failed."
              exit 1
          }

      - name: Push Container Images to GHCR
        shell: powershell
        run: |
          $shaTag = "${{ steps.prep.outputs.sha_tag }}"
          $latestTag = "${{ steps.prep.outputs.latest_tag }}"

          Write-Host "Pushing $shaTag..."
          docker push $shaTag
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "Pushing $latestTag..."
          docker push $latestTag
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # ============================================================================
  # JOB 3: Deploy to Windows Server EC2 via Self-Hosted Runner
  # ============================================================================
  deploy:
    name: Deploy to Windows Server (IIS)
    needs: [lint, build-and-push]
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Initialize Docker CLI configuration
        shell: powershell
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP "docker-config"
          New-Item -ItemType Directory -Path $dockerConfig -Force | Out-Null
          
          # Initialize clean ASCII JSON configuration
          '{}' | Set-Content -Path (Join-Path $dockerConfig "config.json") -Encoding ascii
          
          # Set DOCKER_CONFIG in the GitHub runner environment
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using isolated Docker config: $dockerConfig"

      - name: Free disk space before Docker login
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Running pre-login disk cleanup..."

          $cleanupPaths = @(
            "C:\Windows\Temp\*",
            "$env:TEMP\*"
          )

          foreach ($path in $cleanupPaths) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
          }

          docker image prune -af

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Docker prune finished with exit code $LASTEXITCODE; continuing pipeline."
          } else {
            Write-Host "Dangling Docker images pruned without touching database volumes."
          }

      - name: Authenticate Docker on Self-Hosted Windows Runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostic Port Collision Check
        shell: powershell
        run: |
          $port = ${{ env.APP_PORT }}
          Write-Host "Auditing host port $port for active process bindings..."
          $conn = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Where-Object State -EQ 'Listen'
          if ($conn) {
              $pidVal = $conn.OwningProcess
              $procName = (Get-Process -Id $pidVal -ErrorAction SilentlyContinue).ProcessName
              Write-Warning "Port $port is bound by PID $pidVal ($procName)."
          } else {
              Write-Host "Port $port is available for container binding."
          }

      - name: Diagnose Docker NAT Port Reservations
        shell: powershell
        run: |
          Write-Host "Docker containers publishing port 5000:"
          docker ps -a --filter "publish=5000" --format "table {{.ID}}\t{{.Names}}\t{{.Ports}}"

          Write-Host "Docker NAT network:"
          docker network inspect nat

          Write-Host "Host listeners:"
          Get-NetTCPConnection -LocalPort 5000 -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Backup Existing Image & Pull Deployment Target
        id: pull
        shell: powershell
        run: |
          $shaTag = "${{ needs.build-and-push.outputs.image_tag_sha }}"
          $containerName = "${{ env.CONTAINER_NAME }}"

          # Tag current running container image as rollback backup if present
          $existing = docker ps -a --filter "name=^/${containerName}$" --format "{{.ID}}"
          if ($existing) {
              $currentImg = docker inspect -f '{{.Config.Image}}' $containerName 2>$null
              if ($currentImg) {
                  Write-Host "Backing up currently active image ($currentImg) as opstracker-backup:latest..."
                  docker tag $currentImg "opstracker-backup:latest" 2>$null
              }
          }

          Write-Host "Pulling container image: $shaTag"
          docker pull $shaTag
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to pull image $shaTag from GHCR."
              exit 1
          }

      - name: Idempotent Container Cleanup & Launch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaTag = "${{ needs.build-and-push.outputs.image_tag_sha }}"
          $containerName = "${{ env.CONTAINER_NAME }}"
          $port = [int]"${{ env.APP_PORT }}"

          Write-Host "Removing existing container named $containerName..."
          $namedContainer = docker ps -aq --filter "name=^/${containerName}$"

          if ($namedContainer) {
              docker rm -f $containerName 2>$null
          }

          Write-Host "Finding all containers publishing host port $port..."
          $portContainers = @(
              docker ps -aq --filter "publish=$port"
          ) | Where-Object { $_ -and $_.Trim() }

          foreach ($id in $portContainers) {
              $details = docker ps -a --filter "id=$id" `
                  --format "{{.ID}} {{.Names}} {{.Ports}}"
              Write-Warning "Removing container holding port ${port}: $details"
              docker rm -f $id 2>$null
          }

          # Confirm Docker no longer reports the port as published.
          $remaining = @(
              docker ps -aq --filter "publish=$port"
          ) | Where-Object { $_ -and $_.Trim() }

          if ($remaining) {
              throw "Docker still has a container publishing host port $port."
          }

          # Check for a non-Docker process using the port.
          $listeners = Get-NetTCPConnection `
              -LocalPort $port `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($listeners) {
              $owners = $listeners | ForEach-Object {
                  $process = Get-Process -Id $_.OwningProcess `
                      -ErrorAction SilentlyContinue

                  "PID $($_.OwningProcess) ($($process.ProcessName))"
              }

              throw "Host port $port is already used by: $($owners -join ', ')"
          }

          Write-Host "Starting Windows container $containerName on port $port with persistent data volume..."
          docker run -d `
            --name $containerName `
            --restart unless-stopped `
            -v opstracker_data:C:/app/data `
            -p "${port}:${port}" `
            $shaTag

          if ($LASTEXITCODE -ne 0) {
              docker ps -a
              throw "docker run failed."
          }

      - name: Health Check via Dynamic Windows NAT IP
        id: healthcheck
        shell: powershell
        run: |
          $containerName = "${{ env.CONTAINER_NAME }}"
          $port = ${{ env.APP_PORT }}

          # Extract internal NAT IP to bypass Windows loopback/localhost isolation
          $containerIp = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $containerName
          if (-not $containerIp) {
              Write-Warning "Container NAT IP not found. Falling back to 127.0.0.1."
              $containerIp = "127.0.0.1"
          }

          $targetUrl = "http://${containerIp}:${port}/health"
          Write-Host "Testing container health at: $targetUrl"

          $maxAttempts = 5
          $attempt = 0
          $healthy = $false

          while ($attempt -lt $maxAttempts -and -not $healthy) {
              $attempt++
              Write-Host "[Attempt $attempt/$maxAttempts] GET $targetUrl ..."
              try {
                  $response = Invoke-WebRequest -Uri $targetUrl -UseBasicParsing -TimeoutSec 5
                  if ($response.StatusCode -eq 200) {
                      Write-Host "HEALTH CHECK PASSED! Status Code: $($response.StatusCode)"
                      Write-Host "Response Body: $($response.Content)"
                      $healthy = $true
                      break
                  }
              } catch {
                  Write-Host "Attempt $attempt probe failed: $_"
              }

              if (-not $healthy -and $attempt -lt $maxAttempts) {
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $healthy) {
              Write-Error "HEALTH CHECK FAILED after $maxAttempts attempts."
              Write-Host "==================== DOCKER CONTAINER LOGS (LAST 100 LINES) ===================="
              docker logs --tail 100 $containerName
              Write-Host "================================================================================"
              exit 1
          }

      - name: Automated Rollback on Failure
        if: failure()
        shell: powershell
        run: |
          $containerName = "${{ env.CONTAINER_NAME }}"
          $port = ${{ env.APP_PORT }}

          Write-Warning "Deployment or health check failed! Initiating rollback..."

          $portContainers = @(
              docker ps -aq --filter "publish=$port"
          ) | Where-Object { $_ -and $_.Trim() }

          foreach ($id in $portContainers) {
              docker rm -f $id 2>$null
          }

          $existing = docker ps -a `
            --filter "name=^/${containerName}$" `
            --format "{{.ID}}"

          if ($existing) {
              docker stop -t 5 $containerName 2>$null
              docker rm -f $containerName 2>$null
          } else {
              Write-Host "No failed container exists to remove."
          }

          $backupImg = docker images -q opstracker-backup:latest
          if ($backupImg) {
              docker run -d `
                --name $containerName `
                --restart unless-stopped `
                -p "${port}:${port}" `
                opstracker-backup:latest

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Rollback container failed to start."
                  exit 1
              }

              Write-Host "Rollback successful. Previous container restored."
          } else {
              Write-Warning "No backup image available for rollback."
          }

      - name: Storage Maintenance (Image Prune)
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up dangling Docker images on EC2 host..."
          docker image prune -f
